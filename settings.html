<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YT Local Playback Settings</title>

<style>
body{
font-family:Arial,sans-serif;
padding:20px;
width:280px;
}

h2{
margin-top:0;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
}

select,input{
width:100%;
padding:8px;
box-sizing:border-box;
}

button{
margin-top:18px;
padding:10px;
width:100%;
cursor:pointer;
}

#status{
margin-top:12px;
font-size:12px;
color:green;
}
</style>

</head>
<body>

<h2>Local Playback Settings</h2>

<label>
<input
type="checkbox"
id="enabled">
Enable Interception
</label>

<label for="quality">
Default Video Quality
</label>

<select id="quality">
<option value="480">480p</option>
<option value="720" selected>720p</option>
<option value="1080">1080p</option>
</select>

<label for="helperUrl">
Helper URL
</label>

<input
id="helperUrl"
value="http://127.0.0.1:8000/download"
/>

<button id="save">
Save Settings
</button>

<div id="status"></div>

<script src="settings.js"></script>

</body>
</html>
